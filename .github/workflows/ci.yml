name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x container/*.sh bin/iphonectl scripts/*.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff
        run: pip install ruff && ruff check src tests scripts

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 单元测试只覆盖不碰设备的纯逻辑,不需要 mcp SDK
      - run: pip install pytest pillow
      - run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 直接跑 gitleaks 扫全部历史;gitleaks-action 在首次推送时会对根提交求 <sha>^ 而报错
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --exit-code 1

  image:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # 只验证能从锁定的源码构建成功,不推送镜像
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
