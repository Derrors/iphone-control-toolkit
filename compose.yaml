services:
  iphone:
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host            # 让构建能用宿主机 127.0.0.1 上的代理
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    image: ${IMAGE:-iphone-control-toolkit:local}
    container_name: ${CONTAINER_NAME:-iphone-control-toolkit}
    # 要直接访问 USB 设备;隧道走用户态网络栈,不建内核网卡、不改宿主机网络
    privileged: true
    # host 网络:WDA 端口只绑 127.0.0.1,MCP 通过 docker exec 走 stdio,不对外开放任何端口
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ${DATA_DIR:-./data}:/data
