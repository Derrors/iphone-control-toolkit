services:
  iphone:
    # 只在镜像名以 :local 结尾时由 iphonectl 触发构建(见 bin/iphonectl 的 local_build)
    build:
      context: .
      dockerfile: docker/Dockerfile
      network: host            # 让构建能用宿主机 127.0.0.1 上的代理
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    # 默认用发布在 GHCR 的镜像;想从源码自己构建,在 .env 里设 IMAGE=iphone-control-toolkit:local
    image: ${IMAGE:-ghcr.io/derrors/iphone-control-toolkit:latest}
    container_name: ${CONTAINER_NAME:-iphone-control-toolkit}
    # 要直接访问 USB 设备;隧道走用户态网络栈,不建内核网卡、不改宿主机网络
    privileged: true
    # host 网络:WDA 端口只绑 127.0.0.1,MCP 通过 docker exec 走 stdio,不对外开放任何端口
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ${DATA_DIR:-./data}:/data
